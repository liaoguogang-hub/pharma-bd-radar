# 文章生成 Prompt 配置
# 关键：把实战踩过的坑全部编码进 prompt

# 铁律（违反即判定失败，触发重试）
hard_rules:
  html_structure: |
    【HTML 结构 — 最容易出错的地方】
    - 输出完整 <!DOCTYPE html> 开头
    - <p> 必须成对闭合：<p>文字</p>，漏掉 </p> 是最常见错误
    - <div> <td> <tr> <th> <li> 同样必须闭合
    - <style> 块必须完整包含所有类（见下方 CSS 模板），
      绝不允许输出空的 style 块或缺少类定义

  css_template: |
    【必须使用的 CSS 类】
    .kicker（栏目小字） .sub（副标题） .hook（红底白字钩子框）
    .box .box-t（四色提示框：.w琥珀 .g绿 .r红）
    table th td（深青表头+斑马纹） .m（等宽数字） .hl（红色强调）
    .foot（表下小字） .fn（脚注） .end（深色结语卡）
    h1 h2 h2 .n h3 body .wrap p

  content_rules: |
    【内容规范】
    - 正文 2800-3200 字（不含表格和脚注）
    - 开头必须有钩子：一个反常识数字，或一组矛盾对比
    - 每篇末尾必须有 <p class="fn"> 列出来源，逐条注明来源性质
      （公司公告 / 公司官网 / 监管公示 / 学术会议 / 媒体转述）
    - 查不到的数据写"未找到公开数据"，禁止编造
    - 金额必须分层标注：首付 / 里程碑上限 / 总额，三者不可混写

  style_rules: |
    【文风 — 大白话，不要 AI 味】
    - 用大白话，短句，不用长定语
    - 禁止：赋能、底层逻辑、抓手、护城河、值得注意的是、需要注意的是、
            综上所述、总而言之、不言而喻、至关重要、里程碑意义
    - 禁止"不是…而是…"排比句式
    - 禁止"本文将""本系列将""让我们"
    - 开头直接抛数字或场景，不要铺垫

# 禁止词（质检用）
banned_words:
  - 赋能
  - 底层逻辑
  - 抓手
  - 值得注意的是
  - 需要注意的是
  - 综上所述
  - 总而言之
  - 不言而喻
  - 至关重要
  - 具有里程碑意义
  - 本文将
  - 本系列将
  - 让我们
  - 值得注意的是

banned_patterns:
  - '不是[^，。]{0,15}而是'
  - '不只是[^，。]{0,10}更是'
  - '既[^，。]{0,12}又[^，。]{0,12}还'

# 三种文章类型的结构要求
article_types:
  event_report:
    name: 单笔交易深挖
    structure: |
      1. 钩子：这笔交易最反常识的一个数字或对比
      2. 交易拆解：首付/总额/权益范围/标的阶段（表格化）
      3. 为什么现在：买方动机（专利悬崖/管线补充）
      4. 卖方视角：这家公司为什么能卖出这个价
      5. 风险：交易里没说的东西（里程碑兑现率/权益归属/竞品压力）
      6. 历史对照：同类交易以前怎么做成的

  landscape_review:
    name: 赛道综述
    structure: |
      1. 钩子：这个赛道最近变了什么
      2. 全景表：主要交易/资产一览
      3. 格局分析：谁在领跑，谁掉队，为什么
      4. 关键数据：首付占比、阶段分布、领域分布
      5. 时间表：未来 12-18 个月看什么
      6. 判断：这是短期热度还是长期趋势

  historical_compare:
    name: 历史对照
    structure: |
      1. 钩子：把今天的事放回历史坐标
      2. 参照系：几年前同类事件是什么样
      3. 变与不变：哪些变了，哪些没变
      4. 数据对照：表格化
      5. 结论：历史会重复吗

# 生成参数
generation:
  temperature: 0.7
  max_retries: 3           # 质检失败重试次数
  target_words: 3000
  # ⚠️ 容差放宽：模型在字数上很难精确命中，2250-3900 都算"3000字左右"。
  word_tolerance: 0.75
  max_words: 3900
  # AI 味词的容忍度：出现 1-2 次不触发重试
  #（实测"值得注意的是"单次出现就重写整篇，代价远大于收益，
  #  且重写后常引入新的字数/标签问题）
  ai_word_tolerate: 2
  ai_word_hard_limit: 5